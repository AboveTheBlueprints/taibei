<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>苔碑</title>
<style>
body{background:#e9e4da;color:#333;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;margin:0;padding:24px;display:flex;justify-content:center}
#wrap{max-width:760px;width:100%}
h1{font-size:20px;font-weight:normal;margin:0 0 8px}
p{line-height:1.7;margin:6px 0}
canvas{display:block;margin:14px 0;border-radius:6px 6px 2px 2px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;padding:6px 14px;border:1px solid #888;background:#f6f3ec;border-radius:4px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#msg{min-height:1.7em;color:#555}
#end p{margin:2px 0}
.small{font-size:13px;color:#777}
</style></head><body><div id="wrap">
<h1>苔碑</h1>
<p id="head"></p>
<canvas id="c"></canvas>
<div id="ctl"></div>
<p id="msg"></p>
<div id="end"></div>
<p class="small" id="leg">深绿：苔　灰白：地衣　深色的槽：刻痕（磨过一层就淡一档）　发白的石面：刷糙了</p>
</div>
<script>
'use strict';
const NAME='陈桂芳', W=62, H=17, CS=11, BR_PER=2;
const RW=0.15, RS=2, RO=0.03;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qs=new URLSearchParams(location.search);
const SEED=parseInt(qs.get('seed')||String(1+Math.floor(Math.random()*9999)));
const MASK_ROWS=["..............................................................", "..............xx..........x.....xx...........x...x............", ".......xxxxx..x...........x.....x............x...x............", ".......x..xxxxxxxxxx......x...xxxxxxx....xxxxxxxxxxxxx........", ".......x.xx..x..........xxxxx...x............x.x.x............", ".......x.x...x............x.....x..............x..............", ".......x.x..x..x.........xx..xxxxxxxx....xxxxxxxxxxxxx........", ".......x.x..xxxxxxx......xxxx...xx...........xx...............", ".......x.xx....x........xxx.x...xx...........xx...............", ".......x..x....x........x.x..xxxxxxxx........xxxxxxx..........", ".......x.xx..x.x.xx.....x.x.....xx...........x....xx..........", ".......x.xx.xx.x..x.......x.....xx..........xx....xx..........", ".......x...xx..x..xx......x.....xx.........xx.....xx..........", ".......x...x..xx..........x.xxxxxxxxx.....xx....xxx...........", ".......x......xx..........x...............x.....xxx...........", "..............................................................", ".............................................................."];
const MASK=MASK_ROWS.map(r=>[...r].map(c=>c==="x"));
const BOX=[0,1,2].map(i=>[6+i*17,6+i*17+17]);
function grid(v){return Array.from({length:H},()=>Array(W).fill(v))}
let S;
function newStone(depths){
  const s={D:grid(0),D0:grid(0),M:grid(0),L:grid(0),Ro:grid(0),R:mulberry32(SEED),year:0,reads:[],used:0,log:[],brushLog:[],depths};
  for(let i=0;i<3;i++){const[x0,x1]=BOX[i];for(let y=0;y<H;y++)for(let x=x0;x<Math.min(x1,W);x++)if(MASK[y][x]){s.D[y][x]=depths[i];s.D0[y][x]=depths[i]}}
  const pr=mulberry32(SEED*7+3),pool=[];for(let y=11;y<150;y++)if(y%10)pool.push(y);
  const py=[];while(py.length<4){const k=Math.floor(pr()*pool.length);py.push(pool.splice(k,1)[0])}
  s.passYears=py.sort((a,b)=>a-b);
  return s;
}
function growYear(s){
  const R=s.R,{D,M,L,Ro}=s,rain=0.6+0.8*R();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=D[y][x],ro=Math.min(Ro[y][x],3);
    const wet=0.1+0.3*d+((y>0&&D[y-1][x]>0&&d===0)?0.15:0)+RW*ro;
    if(M[y][x]===0&&R()<0.004*wet*rain*(1+3*d+RS*ro))M[y][x]=0.05;
    if(M[y][x]>0){
      const cap=0.4+0.3*d;M[y][x]=Math.min(1.5,M[y][x]+0.05*wet*rain);
      if(M[y][x]>cap)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1],[0,1]]){
        const nx=x+dx,ny=y+dy;
        if(nx>=0&&nx<W&&ny>=0&&ny<H&&M[ny][nx]===0&&R()<(d>0?0.05*d/3:0.008+RO*ro)*rain)M[ny][nx]=0.05}
    }
    if(d<=1){
      if(L[y][x]===0&&R()<(d===0?0.002:0.0006)*(1+3*ro))L[y][x]=0.05;
      if(L[y][x]>0)L[y][x]=Math.min(1,L[y][x]+0.02);
      if(L[y][x]>0.5)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(nx>=0&&nx<W&&ny>=0&&ny<H&&L[ny][nx]===0&&D[ny][nx]<=1&&R()<(D[ny][nx]===0?0.015:0.005)*(1+2*Math.min(Ro[ny][nx],3)))L[ny][nx]=0.05}
    }
  }
  s.year++;
  if(s.passYears.includes(s.year))s.reads.push([s.year,reading(s)]);
}
function brush(s,i,heavy){
  const[x0,x1]=BOX[i];
  for(let y=0;y<H;y++)for(let x=x0;x<Math.min(x1,W);x++){
    if(s.D0[y][x]>0&&!heavy)continue;
    s.M[y][x]=0;s.L[y][x]=0;s.Ro[y][x]++;
    if(heavy&&s.D[y][x]>0)s.D[y][x]=Math.max(0,s.D[y][x]-1);
  }
}
function cellKind(s,x,y){
  if(s.M[y][x]>0.3)return'#';if(s.L[y][x]>0.4)return':';
  const d=s.D[y][x];if(d>=2.6)return'O';if(d>=1.5)return'o';if(d>0)return'.';return' ';
}
// 第 17 天 08:26 改：照一个没见过名字的生人看 6 张碑图念出来的字校过（~/碰/苔碑/预期.md）。笔画上只要有苔就算看得见（不管槽还剩多深），背景上的苔、地衣算乱。
function legible(s,i){
  const[x0,x1]=BOX[i];let g=0,sig=0,noise=0;
  for(let y=0;y<H;y++)for(let x=x0;x<Math.min(x1,W);x++){
    const c=cellKind(s,x,y);
    if(s.D0[y][x]>0){g++;if(c==='#'||c==='O'||c==='o')sig+=1;else if(c==='.')sig+=0.3}
    else{if(c==='#')noise+=1;else if(c===':')noise+=0.4}
  }
  sig/=Math.max(g,1);noise/=Math.max(g,1);
  if(sig<0.64)return 0;const sc=sig-0.5*noise;return sc<0.2?0:(sc>0.57?1:0.5);
}
function reading(s){let r='';for(let i=0;i<3;i++){const v=legible(s,i);r+=v===1?NAME[i]:(v===0.5?'（像是'+NAME[i]+'？）':'□')}return r}
// ---- 画 ----
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=W*CS;cv.height=H*CS;
const JIT=(()=>{const r=mulberry32(99),a=[];for(let i=0;i<W*H*4;i++)a.push(r());return a})();
function draw(s,showRough){
  cx.fillStyle='#9a9a94';cx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const j=JIT[(y*W+x)*4],px=x*CS,py=y*CS;
    let base=150+Math.floor(j*14);
    if(s&&s.Ro[y][x]>0)base+=Math.min(s.Ro[y][x],4)*9;
    cx.fillStyle=`rgb(${base},${base},${base-5})`;cx.fillRect(px,py,CS,CS);
    if(!s)continue;
    const d=s.D[y][x];
    if(d>0){const k=d>=2.6?70:(d>=1.5?102:136);cx.fillStyle=`rgb(${k},${k},${k-3})`;cx.fillRect(px+1,py+1,CS-2,CS-2)}
    if(s.L[y][x]>0.4){cx.fillStyle=`rgba(214,212,190,${0.35+0.45*s.L[y][x]})`;cx.beginPath();cx.arc(px+CS/2+(JIT[(y*W+x)*4+1]-.5)*3,py+CS/2,CS*(0.3+0.15*s.L[y][x]),0,7);cx.fill()}
    else if(s.L[y][x]>0.05){cx.fillStyle='rgba(222,220,196,0.35)';cx.fillRect(px+3,py+3,CS-6,CS-6)}
    if(s.M[y][x]>0.3){const g=Math.min(1,s.M[y][x]);cx.fillStyle=`rgb(${Math.floor(70-30*g)},${Math.floor(110+20*j)},${Math.floor(50-20*g)})`;
      cx.beginPath();cx.arc(px+CS/2+(JIT[(y*W+x)*4+2]-.5)*3,py+CS/2+(JIT[(y*W+x)*4+3]-.5)*3,CS*(0.45+0.2*g),0,7);cx.fill()}
    else if(s.M[y][x]>0){cx.fillStyle='rgba(80,120,50,0.5)';cx.fillRect(px+4,py+4,CS-8,CS-8)}
  }
}
// ---- 走 ----
const VISITS=[];for(let y=10;y<=150;y+=10)VISITS.push(y);
let vi=0;
const head=document.getElementById('head'),ctl=document.getElementById('ctl'),msg=document.getElementById('msg'),end=document.getElementById('end');
function btn(t,f,dis){const b=document.createElement('button');b.textContent=t;b.onclick=f;b.disabled=!!dis;return b}
function start(){
  S=null;vi=0;end.innerHTML='';msg.textContent='';
  head.textContent='一块新碑，上面要刻三个字：陈桂芳。往后你家每十年来扫一回墓，一直扫一百五十年。先定每个字刻深还是刻浅：深的槽存水，浅的不存。';
  draw(null);
  const pick=['深','深','深'];ctl.innerHTML='';
  const row=document.createElement('div');row.className='row';
  const lab=i=>NAME[i]+'：现在刻'+pick[i]+'，点了改'+(pick[i]==='深'?'浅':'深');
  for(let i=0;i<3;i++){const b=btn(lab(i),()=>{pick[i]=pick[i]==='深'?'浅':'深';b.textContent=lab(i)});row.appendChild(b)}
  ctl.appendChild(row);
  const r2=document.createElement('div');r2.className='row';
  r2.appendChild(btn('刻好了',()=>{S=newStone(pick.map(c=>c==='深'?3:1));S.carved=pick.join('');arrive()}));ctl.appendChild(r2);
}
function arrive(){
  while(S.year<VISITS[vi])growYear(S);
  S.used=0;S.log=[];
  render();
}
function render(){
  const lastV=vi===VISITS.length-1;
  head.textContent=lastV?`第 ${S.year} 年，第 ${vi+1} 回，最后一回来扫墓。`:`第 ${S.year} 年，第 ${vi+1} 回来扫墓。`;
  draw(S);
  ctl.innerHTML='';
  const left=BR_PER-S.used;
  for(const heavy of[false,true]){
    const row=document.createElement('div');row.className='row';
    for(let i=0;i<3;i++)row.appendChild(btn((heavy?'重刷':'轻刷')+NAME[i],()=>{brush(S,i,heavy);S.used++;S.log.push((heavy?'重刷':'轻刷')+NAME[i]);S.brushLog.push([S.year,(heavy?'重刷':'轻刷')+NAME[i]]);render()},left<=0));
    ctl.appendChild(row);
  }
  const r3=document.createElement('div');r3.className='row';
  r3.appendChild(lastV?btn('刷完了，走',finish):btn('走，十年后再来',()=>{vi++;arrive()}));ctl.appendChild(r3);
  msg.textContent=S.log.length?`这一回刷了：${S.log.join('、')}（还能刷 ${left} 下）`:`这一回能刷 ${BR_PER} 下。轻刷：只刷那个字周围的石面，不碰笔画槽。重刷：连槽里一起刷干净，槽会磨掉一层（深槽刻了三层，浅槽一层）。`;
}
function finish(){
  head.textContent=`第 ${S.year} 年，最后一回来扫墓。`;
  draw(S);ctl.innerHTML='';msg.textContent='';
  let h='<p>这一百五十年里，你不在的时候，有几个不认识的人走过，蹲下来念了念碑上的字：</p>';
  for(const[y,r]of S.reads.concat([[S.year,reading(S)]]))h+=`<p>　第 ${y} 年：${r}</p>`;
  h+='<p style="margin-top:14px">你一百五十年里刷过的地方（越白刷得越多，小方框是当年刻的笔画）：</p><canvas id="c2"></canvas>';
  end.innerHTML=h;
  const c2=document.getElementById('c2');c2.width=W*CS;c2.height=H*CS;const g=c2.getContext('2d');
  g.fillStyle='#55554f';g.fillRect(0,0,c2.width,c2.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=S.Ro[y][x];
    if(n){const k=Math.min(255,90+n*18);g.fillStyle=`rgb(${k},${k},${k-6})`;g.fillRect(x*CS,y*CS,CS,CS)}
    if(S.D0[y][x]>0){g.strokeStyle='rgba(30,30,28,0.7)';g.lineWidth=1.5;g.strokeRect(x*CS+2.5,y*CS+2.5,CS-5,CS-5)}}
  const r=document.createElement('div');r.className='row';r.appendChild(btn('再刻一块碑',start));end.appendChild(r);
}
start();
</script></body></html>
